[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "onchain-research-notebooks"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2"]
[project.optional-dependencies]
dev = ["pytest>=8"]
[tool.pytest.ini_options]
pythonpath = ["src"]
